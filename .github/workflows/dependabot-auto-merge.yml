name: Dependabot auto-merge

# Auto-merges Dependabot PRs for MINOR and PATCH bumps once required CI
# checks (quality + e2e) are green. Major bumps are intentionally excluded —
# framework/tooling majors (Next, React, TypeScript, ESLint, …) wait for a
# human, matching the ignore rules in .github/dependabot.yml.
#
# For grouped PRs, dependabot/fetch-metadata reports the highest semver bump
# in the group, so any group that contains a major is excluded automatically.
#
# Requires: repo setting "Allow auto-merge" enabled, and branch protection on
# main with `quality` + `e2e` as required status checks (that is what makes
# --auto actually wait for green instead of merging immediately).

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for minor and patch updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
